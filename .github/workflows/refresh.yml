name: Refresh Porto Knowledge

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [porto-source-changed]
  schedule:
    - cron: '17 4 * * 1-5'

concurrency:
  group: refresh-porto-knowledge
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate enrichment and committed graph
        run: |
          python3 -m unittest discover -s tests
          python3 scripts/knowledge.py check
      - name: Check out authoritative sources
        run: |
          git clone https://github.com/porto-labs-xyz/whitepaper.git workspace/whitepaper
          git clone https://github.com/porto-labs-xyz/PIPs.git workspace/pips
          git clone https://github.com/porto-labs-xyz/docs.git workspace/docs
          git clone https://github.com/porto-labs-xyz/lander.git workspace/porto-landing
      - name: Read the pinned private FREQ revision
        id: freq
        run: |
          python3 - <<'PY'
          import json, os
          with open('sources/manifest.json') as source:
              manifest = json.load(source)
          revision = next(repo['source_revision'] for repo in manifest['repositories'] if repo['id'] == 'freq')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'revision={revision}', file=output)
          PY
      - name: Check out private FREQ sources for metadata-only registration
        uses: actions/checkout@v4
        with:
          repository: porto-labs-xyz/freq
          ref: ${{ steps.freq.outputs.revision }}
          token: ${{ secrets.PORTO_KNOWLEDGE_SOURCES_TOKEN }}
          path: workspace/freq
          persist-credentials: false
      - name: Build and verify projections
        run: |
          python3 scripts/refresh.py --workspace workspace
          python3 scripts/knowledge.py check
      - name: Commit refreshed projection when changed
        run: |
          git config user.name "porto-knowledge[bot]"
          git config user.email "porto-knowledge[bot]@users.noreply.github.com"
          git add graph human dist
          git diff --cached --quiet || git commit -m "Refresh knowledge graph"
          git pull --rebase origin main
          git push
