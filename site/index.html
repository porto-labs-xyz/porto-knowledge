<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Porto Knowledge</title>
  <style>
    :root { color-scheme: dark; --ink:#eee7d6; --paper:#11110f; --panel:#191916; --line:#3c3a34; --muted:#aaa495; --red:#d84c42; --gold:#c8a55d; --blue:#5d91c5; }
    * { box-sizing:border-box } body { margin:0; background:radial-gradient(circle at 76% 4%,#302319 0,transparent 30rem),var(--paper); color:var(--ink); font:16px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace }
    header { padding:1.25rem 1.5rem; display:flex; gap:1rem; align-items:center; border-bottom:1px solid var(--line) } h1 { font:600 1.05rem/1 Avenir,Arial,sans-serif; letter-spacing:.08em; margin:0; text-transform:uppercase } .mark { color:var(--red); font-size:1.4rem }
    input { margin-left:auto; width:min(26rem,48vw); padding:.65rem .8rem; color:var(--ink); background:#0e0e0c; border:1px solid var(--line); border-radius:.3rem; font:inherit } input:focus { outline:1px solid var(--gold) }
    main { display:grid; grid-template-columns: 1fr 22rem; min-height:calc(100vh - 4.3rem) } #surface { min-width:0; padding:1rem; position:relative; overflow:hidden } #graph { width:100%; height:calc(100vh - 6.3rem); min-height:36rem; display:block; border:1px solid var(--line); background:linear-gradient(145deg,#151511,#0e0e0c) }
    aside { border-left:1px solid var(--line); padding:1.25rem; background:rgba(20,20,17,.96); overflow:auto; max-height:calc(100vh - 4.3rem) } aside h2 { margin:0 0 .8rem; color:var(--gold); font:600 .8rem/1.2 Avenir,Arial,sans-serif; text-transform:uppercase; letter-spacing:.09em } #detail { color:var(--muted); font-size:.82rem } #detail strong { color:var(--ink) } .meta { color:var(--gold); font-size:.72rem; overflow-wrap:anywhere } .edge { margin:.45rem 0; padding-left:.7rem; border-left:1px solid var(--line) }
    .legend { position:absolute; left:2rem; bottom:2rem; display:flex; flex-wrap:wrap; gap:.35rem .8rem; color:var(--muted); font-size:.72rem; pointer-events:none }.dot { display:inline-block; width:.55rem; height:.55rem; border-radius:50%; margin-right:.25rem }.node { cursor:pointer; stroke:#111; stroke-width:1.5 }.node:hover,.node.active { stroke:var(--ink); stroke-width:3 }.link { stroke:#4a483f; stroke-opacity:.45; stroke-width:1 }.link.dim,.node.dim { opacity:.12 }.label { fill:#d7d1c4; font-size:9px; pointer-events:none; text-anchor:middle } .label.dim { opacity:.12 }
    @media(max-width:800px){ main{grid-template-columns:1fr} aside{border-left:0;border-top:1px solid var(--line);max-height:none} #graph{height:62vh} header{padding:.9rem} input{width:58vw}.legend{display:none} }
  </style>
</head>
<body>
  <header><span class="mark">P</span><h1>Porto Knowledge</h1><input id="search" placeholder="Search concepts, sources and routes" aria-label="Search graph"></header>
  <main><section id="surface"><svg id="graph" role="img" aria-label="Interactive Porto knowledge graph"></svg><div class="legend" id="legend"></div></section><aside><h2>Knowledge graph</h2><div id="detail">Select a node to see its provenance and connected knowledge.<br><br>Search narrows the graph. Source documents remain authoritative.</div></aside></main>
  <!-- GRAPH_DATA -->
  <script>
  const colours={knowledge_base:'#c8a55d',domain:'#d84c42',concept:'#5d91c5',document:'#c6bea9',agent_route:'#aa7fb3'};
  const svg=document.getElementById('graph'), detail=document.getElementById('detail'), search=document.getElementById('search');
  let graph, selected, query=''; const ns='http://www.w3.org/2000/svg';
  const el=(name,attrs={})=>{const e=document.createElementNS(ns,name);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));return e};
  function text(value){return String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
  function layout(nodes,w,h){ const groups=[...new Set(nodes.map(n=>n.type))]; return new Map(nodes.map((n,i)=>{const g=groups.indexOf(n.type), inGroup=nodes.filter(x=>x.type===n.type), p=inGroup.indexOf(n), angle=(p/inGroup.length)*Math.PI*2-Math.PI/2, ring=Math.min(w,h)*(.18+g*.075); return [n.id,{x:w/2+Math.cos(angle)*ring,y:h/2+Math.sin(angle)*ring}] })) }
  function render(){ const box=svg.getBoundingClientRect(), w=Math.max(600,box.width),h=Math.max(500,box.height); svg.setAttribute('viewBox',`0 0 ${w} ${h}`); svg.replaceChildren(); const positions=layout(graph.nodes,w,h), byId=new Map(graph.nodes.map(n=>[n.id,n])); const terms=query.toLowerCase().split(/\s+/).filter(Boolean); const matches=n=>!terms.length||terms.every(t=>JSON.stringify(n).toLowerCase().includes(t)); const matching=new Set(graph.nodes.filter(matches).map(n=>n.id)); const neighbours=new Set(graph.edges.filter(e=>matching.has(e.source)||matching.has(e.target)).flatMap(e=>[e.source,e.target]));
    graph.edges.forEach(e=>{const a=positions.get(e.source),b=positions.get(e.target); if(!a||!b)return; const line=el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:`link ${terms.length&&!neighbours.has(e.source)&&!neighbours.has(e.target)?'dim':''}`}); svg.append(line)});
    graph.nodes.forEach(n=>{const p=positions.get(n),visible=!terms.length||matching.has(n.id)||neighbours.has(n.id), group=el('g',{class:visible?'':'dim'}); const circle=el('circle',{cx:p.x,cy:p.y,r:n.type==='domain'?10:7,fill:colours[n.type]||'#aaa',class:`node ${selected===n.id?'active':''}`}); circle.addEventListener('click',()=>show(n)); group.append(circle); const label=el('text',{x:p.x,y:p.y+(n.type==='domain'?23:18),class:'label'}); label.textContent=n.label; group.append(label); svg.append(group) }); }
  function show(n){selected=n.id; const connected=graph.edges.filter(e=>e.source===n.id||e.target===n.id); const byId=new Map(graph.nodes.map(x=>[x.id,x])); detail.innerHTML=`<strong>${text(n.label)}</strong><p>${text(n.description)}</p><div class="meta">${text(n.type)}${n.authority?' · '+text(n.authority):''}${n.source_path?' · '+text(n.source_path):''}</div><h2 style="margin-top:1.5rem">Connected knowledge</h2>${connected.map(e=>{const other=byId.get(e.source===n.id?e.target:e.source);return `<div class="edge"><span class="meta">${text(e.relation)} · ${text(e.confidence)}</span><br>${text(other.label)}</div>`}).join('')||'<p>No linked nodes.</p>'}`; render() }
  graph=JSON.parse(document.getElementById('graph-data').textContent); document.getElementById('legend').innerHTML=Object.entries(colours).map(([k,v])=>`<span><i class="dot" style="background:${v}"></i>${k.replace('_',' ')}</span>`).join(''); render(); addEventListener('resize',render);
  search.addEventListener('input',e=>{query=e.target.value;render()});
  </script>
</body>
</html>
